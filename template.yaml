AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  SmarTek21 Academy — static React site on S3 + CloudFront, API on a single
  Lambda (Function URL), data in DynamoDB on-demand. Microsoft Entra ID auth is
  verified in-Lambda against Microsoft's public keys (api/_lib/auth.js).
  Designed for ~$0/month.
  NOTE: the running deployment in the current account ships the Lambda + site
  directly (aws lambda update-function-code / s3 sync), not via this template,
  because the deploy user lacks iam:PassRole. This template is kept as the
  source-of-truth reference for the infra and for future clean redeploys.

Parameters:
  AllowedOrigin:
    Type: String
    Default: "*"
    Description: >
      CORS origin for the API. After the first deploy, set this to your
      CloudFront URL (https://xxxx.cloudfront.net) and redeploy to lock it down.
  CustomDomain:
    Type: String
    Default: ""
    Description: >
      Optional custom domain for the site (e.g. training.smartek21.com). Leave
      empty to use only the default *.cloudfront.net URL.
  CertificateArn:
    Type: String
    Default: ""
    Description: >
      ACM certificate ARN (must be in us-east-1) covering CustomDomain. Required
      when CustomDomain is set.
  BedrockModelId:
    Type: String
    Default: "us.amazon.nova-lite-v1:0"
    Description: >
      Source (system) inference-profile id that the tagged application inference
      profile copies from. Amazon Nova Lite, cross-region (us.). /api/chat does
      NOT invoke this directly — it invokes the application inference profile
      built from it (see NovaLiteInferenceProfile) so spend is cost-attributed.
  ChatRateLimitPerMinute:
    Type: Number
    Default: 10
    Description: >
      Max /api/chat requests per user per minute (burst cap). Tunable at deploy
      time without a code change.
  ChatRateLimitPerDay:
    Type: Number
    Default: 100
    Description: >
      Max /api/chat requests per user per UTC day (cost cap).

Conditions:
  HasCustomDomain: !Not [!Equals [!Ref CustomDomain, ""]]

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 15
    MemorySize: 256

Resources:
  # ---------------------------------------------------------------------------
  # DynamoDB — single table, on-demand (pay per request). GSI1 lists all user
  # profiles ordered by last_seen for the admin dashboard.
  # ---------------------------------------------------------------------------
  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: smartek21-academy
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
        - { AttributeName: GSI1PK, AttributeType: S }
        - { AttributeName: GSI1SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - { AttributeName: GSI1PK, KeyType: HASH }
            - { AttributeName: GSI1SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      # Garbage-collects expired per-user rate-limit counters (RL#chat#…).
      # Correctness never depends on deletion timing — old windows are simply
      # never read again — so lazy TTL deletion is fine.
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  # ---------------------------------------------------------------------------
  # Bedrock application inference profile — a TAGGABLE wrapper around the Nova
  # Lite cross-region (system) inference profile. On-demand model usage has no
  # resource to tag, so its cost is invisible to the Project=smartek21-academy
  # cost-allocation filter used by the admin cost dashboard. Invoking /api/chat
  # through this tagged profile instead attributes the token spend to ST21, so
  # it finally shows up as an "Amazon Bedrock" line in the dashboard.
  # NOTE: attribution is not retroactive and Cost Explorer lags ~24-48h.
  # ---------------------------------------------------------------------------
  NovaLiteInferenceProfile:
    Type: AWS::Bedrock::ApplicationInferenceProfile
    Properties:
      InferenceProfileName: smartek21-academy-nova-lite
      Description: Tagged Nova Lite profile for chat cost attribution
      ModelSource:
        CopyFrom: !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${BedrockModelId}"
      Tags:
        - Key: Project
          Value: smartek21-academy

  # ---------------------------------------------------------------------------
  # API — one Lambda, all 7 routes, exposed via a Function URL.
  # /api/chat calls Amazon Nova Lite via Bedrock. Guardrails are handled in
  # code (topic-classifier pre-check + system-prompt grounding), so no Bedrock
  # Guardrail resource is needed. Timeout is bumped for the two Bedrock calls.
  # ---------------------------------------------------------------------------
  # Execution role defined EXPLICITLY (rather than via SAM's `Policies:`
  # shorthand, which auto-generates and tags a role) so deploying does not
  # require iam:TagRole. Roles are not billable, so omitting the Project tag
  # here does not affect cost attribution — the billable resources keep theirs.
  # The inline policy mirrors exactly what the former Policies: block granted.
  ApiFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ApiFunctionInline
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # DynamoDBCrudPolicy equivalent — table + its indexes.
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:BatchGetItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:ConditionCheckItem
                  - dynamodb:DescribeTable
                Resource:
                  - !GetAtt Table.Arn
                  - !Sub "${Table.Arn}/index/*"
              # Invoking through the application inference profile needs
              # InvokeModel on BOTH the profile ARN and the model(s) it routes
              # to (all regions the cross-region system profile spans).
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource:
                  - !GetAtt NovaLiteInferenceProfile.InferenceProfileArn
                  - !Sub "arn:aws:bedrock:*::foundation-model/amazon.nova-lite-v1:0"
                  - !Sub "arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*amazon.nova-lite-v1:0"
              # Cost Explorer for the admin cost dashboard (/api/admin-costs). CE
              # has no resource-level scoping, so Resource must be "*". Read-only.
              - Effect: Allow
                Action:
                  - ce:GetCostAndUsage
                  - ce:GetCostForecast
                  - ce:GetDimensionValues
                Resource: "*"

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: smartek21-academy-api
      CodeUri: api/
      Handler: lambda.handler
      Timeout: 30
      Role: !GetAtt ApiFunctionRole.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref Table
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          # Invoke via the tagged application inference profile (its ARN), not the
          # raw model id, so Bedrock spend carries the Project tag. chat.js reads
          # this value straight into ConverseCommand.modelId — no code change.
          BEDROCK_MODEL_ID: !GetAtt NovaLiteInferenceProfile.InferenceProfileArn
          CHAT_RATE_LIMIT_PER_MINUTE: !Ref ChatRateLimitPerMinute
          CHAT_RATE_LIMIT_PER_DAY: !Ref ChatRateLimitPerDay
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins: ["*"]
          AllowMethods: ["GET", "POST"]
          AllowHeaders: ["Content-Type", "Authorization"]

  # ---------------------------------------------------------------------------
  # Static site bucket (private; only CloudFront can read it via OAC).
  # ---------------------------------------------------------------------------
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "smartek21-academy-site-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  OAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "smartek21-academy-oac-${AWS::AccountId}"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # ---------------------------------------------------------------------------
  # CloudFront: default origin = S3 (static SPA); /api/* origin = Lambda URL.
  # SPA deep links fall back to index.html (403/404 -> /index.html, 200).
  # ---------------------------------------------------------------------------
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        Aliases: !If [HasCustomDomain, [!Ref CustomDomain], !Ref "AWS::NoValue"]
        ViewerCertificate: !If
          - HasCustomDomain
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - !Ref "AWS::NoValue"
        Origins:
          - Id: s3-site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !Ref OAC
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: lambda-api
            # Function URL is https://<host>/ — take just the host for CloudFront.
            DomainName: !Select [2, !Split ["/", !GetAtt ApiFunctionUrl.FunctionUrl]]
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: ["TLSv1.2"]
        DefaultCacheBehavior:
          TargetOriginId: s3-site
          ViewerProtocolPolicy: redirect-to-https
          # CachingOptimized managed policy
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: lambda-api
            ViewerProtocolPolicy: https-only
            AllowedMethods: ["GET", "HEAD", "OPTIONS", "PUT", "POST", "PATCH", "DELETE"]
            # CachingDisabled managed policy
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            # AllViewerExceptHostHeader — forwards Authorization, drops Host
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
        # These make SPA deep links / refreshes work: S3+OAC returns 403 for a
        # missing object (no s3:ListBucket granted), so a client-side route like
        # /reading/module-3 404s at S3 and we serve index.html instead.
        #
        # KNOWN ARTIFACT (accepted, not a bug): CustomErrorResponses are
        # distribution-wide, so they ALSO catch 403/404 from the /api/* Lambda
        # origin — a legitimate 403 (e.g. non-admin hitting /api/admin-costs or
        # /api/admin-users) is rewritten to 200 + index.html, and unknown /api
        # routes 404 -> 200 SPA. Fails SAFE (no data leak; the UI gates admin
        # calls behind isAdmin so this path isn't reached in normal use). Only
        # downside is a dishonest status code for DIRECT API callers. Other
        # statuses (401/400/503/200) pass through untouched. Proper fix if ever
        # needed: drop these and do SPA fallback via a CloudFront Function
        # attached to the DEFAULT (S3) behavior only, leaving /api/* untouched.
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

Outputs:
  SiteURL:
    Description: Public URL of the app (use as Entra redirect URI + AllowedOrigin)
    Value: !Sub "https://${Distribution.DomainName}"
  BucketName:
    Description: Upload the built site here (aws s3 sync dist/ s3://BUCKET)
    Value: !Ref SiteBucket
  DistributionId:
    Description: CloudFront distribution id (for cache invalidation)
    Value: !Ref Distribution
  ApiFunctionUrl:
    Description: Direct Lambda URL (normally reached only via CloudFront /api/*)
    Value: !GetAtt ApiFunctionUrl.FunctionUrl
  TableName:
    Value: !Ref Table
